name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # Every entry is listed under `include` so the x11 one becomes its own
        # job. Next to an `os: [...]` list it would instead add `features` to
        # the existing ubuntu job.
        include:
          - os: ubuntu-latest
          - os: macos-latest
          # The opt-in `x11` feature (see README "X11 (opt-in)").
          - os: ubuntu-latest
            features: x11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Empty for the default jobs; `--features ""` enables nothing.
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          # The matrix isn't part of the cache key, so without this both
          # ubuntu jobs would share (and overwrite) one cache.
          key: ${{ matrix.features }}

      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features "$FEATURES" -- -D warnings -W clippy::pedantic
      - run: cargo build --features "$FEATURES"
      - run: cargo nextest run --features "$FEATURES"

# Pushing a `v*` tag (see `just release`) creates a GitHub release and attaches
# a prebuilt binary per target, named to match `[package.metadata.binstall]`
# in Cargo.toml: `gpui-notes-<target>-v<version>.tar.gz` (`.zip` on Windows),
# binary at the root.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history and tags, for the commit list below

      - name: Check the tag matches Cargo.toml's version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      # GitHub's generated notes only list merged PRs, and work lands directly
      # on main, so prepend the commit subjects since the previous tag.
      # --first-parent leaves a merged branch's commits to the PR entry.
      - name: Create the release with generated notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          notes=$(git log --first-parent --no-merges --invert-grep --grep='^chore(release):' --pretty='- %s (%h)' "$range")
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes "## Changes"$'\n\n'"$notes" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Uploaded as .zip (the action's default on Windows); see the
          # binstall override in Cargo.toml.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: gpui-notes
          target: ${{ matrix.target }}
          archive: $bin-$target-$tag
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

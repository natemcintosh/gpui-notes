[package]
name = "gpui-notes"
version = "0.3.2"
edition = "2021"
description = "A Logseq-inspired outliner for plain-markdown notes, built on GPUI"
repository = "https://github.com/natemcintosh/gpui-notes"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "ec9be5c3" }
# smallvec is included here for convenience, it is used by gpui when creating
# components that can have children. uncomment this line or
# use `cargo add smallvec` to add it to your project
smallvec = "1.13.2"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.11", default-features = false }
regex = "1"
unicode-segmentation = "1.13.2"
spellbook = "0.4.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }

# font-kit is required on macOS — without it gpui_macos falls back to a
# NoopTextSystem and text never paints. See README "GPUI dependency".
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ec9be5c3", features = ["runtime_shaders", "font-kit"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ec9be5c3", features = ["wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ec9be5c3" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "ec9be5c3", features = ["test-support"] }
rstest = "0.26.1"
tempfile = "3"

# Prebuilt binaries for `cargo binstall`, published by .github/workflows/release.yml.
# gpui is a git dependency, so this crate can't go on crates.io; install with
# `cargo binstall --git https://github.com/natemcintosh/gpui-notes gpui-notes`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
